name: Runwise
description: 'Runwise provides wireless smart-control systems that automate heating,
  cooling, water, and gas infrastructure in multifamily and commercial buildings.
  Its retrofit hardware and cloud platform replace legacy boiler, steam, and HVAC
  controls, cutting heating, cooling, and water bills by roughly 23% with same-day
  installation. Runwise reports more than 10,300 buildings under management and over
  $175 million in cumulative utility savings for customers. The company is backed by
  Fifth Wall, Initialized Capital, and Menlo Ventures. This API Evangelist profile
  tracks Runwise''s public web presence; as of this pass no public API, developer
  portal, or programmatic integration surface has been identified.'
